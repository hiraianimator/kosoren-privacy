<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>コソ練マネージャー サポート</title>
  <meta name="description" content="コソ練マネージャーのサポート・お問い合わせページ">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1d2329;
      --muted: #66727d;
      --border: #dfe4e8;
      --accent: #0a6fc2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #191d22;
        --text: #eef2f5;
        --muted: #a7b0b8;
        --border: #303740;
        --accent: #69b7f0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic",
                   "Meiryo", sans-serif;
      line-height: 1.75;
    }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 48px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.3;
    }
    h2 {
      margin-top: 34px;
      margin-bottom: 8px;
      font-size: 19px;
    }
    p, li { font-size: 15px; }
    .muted { color: var(--muted); }
    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 13px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    a { color: var(--accent); }
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 600px) {
      main {
        margin: 20px auto;
        padding: 24px 20px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
<main>
  <h1>コソ練マネージャー<br>サポート</h1>

  <p>
    コソ練マネージャーに関する不具合報告、質問、機能要望などは、
    下記のお問い合わせフォームからお送りください。
  </p>

  <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSfNe_G53DbLm4D-iY7kxDubW00kXnFVyJnyiiVVduaCyZk1Xg/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer">
    お問い合わせフォームを開く
  </a>

  <h2>お問い合わせについて</h2>
  <ul>
    <li>不具合報告</li>
    <li>アプリの使い方に関する質問</li>
    <li>機能要望</li>
    <li>その他のお問い合わせ</li>
  </ul>

  <p class="muted">
    返信が必要な場合は、お問い合わせフォーム内の返信先入力欄をご利用ください。
  </p>

  <h2>プライバシーポリシー</h2>
  <p>
    本アプリのデータの取り扱いについては、
    <a href="https://hiraianimator.github.io/kosoren-privacy/">プライバシーポリシー</a>をご確認ください。
  </p>

  <footer>
    対象アプリ：コソ練マネージャー
  </footer>
</main>
</body>
</html>
